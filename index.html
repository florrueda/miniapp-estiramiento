<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pausa activa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8F0;
    --ink: #3B2B30;
    --ink-soft: #6E5A5F;
    --rose: #C2536E;
    --rose-dark: #A7405A;
    --rose-tint: #F7E1E4;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --shadow: 0 1px 2px rgba(110, 40, 60, .08), 0 6px 14px -4px rgba(110, 40, 60, .16), 0 16px 32px -14px rgba(110, 40, 60, .24);
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); }

  /* Sprites de los GIF; tamaño y cuadro los pone renderer.js */
  .sprite {
    position: absolute; background-repeat: no-repeat; cursor: grab; touch-action: none;
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  .sprite:active { cursor: grabbing; }
  .sprite.active { opacity: 1; pointer-events: auto; }
  #typing { right: 8px; bottom: 4px; background-image: url(assets/typing.png); }
  #stretch { left: 214px; top: 44px; background-image: url(assets/stretch.png); }
  #neck { left: 258px; top: 78px; background-image: url(assets/neck.png); }

  .heart { position: absolute; left: 300px; top: 118px; width: 18px; opacity: 0; pointer-events: none; }
  .happy .heart { animation: float 1.1s ease-out; }
  @keyframes float {
    0% { opacity: 0; transform: translateY(6px); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-18px); }
  }

  /* Globito */
  #bubble {
    position: absolute; left: 8px; top: 40px; width: 214px; box-sizing: border-box;
    padding: 16px 18px 14px; background: var(--cream); border-radius: 18px;
    box-shadow: var(--shadow);
    opacity: 0; transform: translateX(10px) scale(.96); transform-origin: 100% 30%;
    transition: opacity .25s ease, transform .5s var(--spring);
    pointer-events: none;
  }
  #bubble::after {
    content: ''; position: absolute; right: -6px; top: 48px; width: 14px; height: 14px;
    background: var(--cream); transform: rotate(45deg); border-radius: 2px;
  }
  .stretch #bubble { opacity: 1; transform: none; pointer-events: auto; transition-delay: .9s; }
  #bubble h1 {
    margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: 19px; line-height: 1.15; letter-spacing: -0.02em;
  }
  #bubble p { margin: 0 0 14px; font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
  .actions { display: flex; gap: 8px; }
  button {
    font: 600 12.5px/1 'DM Sans', system-ui, sans-serif; border-radius: 10px;
    padding: 10px 9px; min-height: 36px; cursor: pointer; white-space: nowrap; border: 1px solid transparent;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  button:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
  .primary { flex: 1; background: var(--rose); color: #fff; }
  .primary:hover { background: var(--rose-dark); }
  .primary:active { background: #8E3149; }
  .ghost { background: transparent; color: var(--rose-dark); border-color: #E8C4CC; }
  .ghost:hover { background: var(--rose-tint); }
  .ghost:active { background: #F0CDD3; }

  #hint {
    position: absolute; right: 215px; top: 150px; padding: 6px 10px; border-radius: 10px;
    background: var(--cream); box-shadow: var(--shadow); font-size: 12px; color: var(--ink-soft);
    white-space: nowrap; opacity: 0; transition: opacity .2s ease; pointer-events: none;
  }
  .hover:not(.stretch) #hint { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .heart { animation: none !important; }
    .sprite, #bubble { transition-duration: .01s; }
  }
</style>
</head>
<body>
<main id="scene">
  <div class="sprite active" id="typing" role="img" aria-label="Mini Flor tipeando en su compu"></div>
  <div class="sprite" id="stretch" role="img" aria-label="Mini Flor estirando los brazos hacia arriba"></div>
  <div class="sprite" id="neck" role="img" aria-label="Mini Flor estirando el cuello"></div>

  <section id="bubble" aria-live="polite">
    <h1>Hora de estirarte</h1>
    <p id="tip"></p>
    <div class="actions">
      <button class="primary" id="done">Listo, me estiré</button>
      <button class="ghost" id="snooze">En 5 min</button>
    </div>
  </section>
  <div id="hint"></div>

  <svg class="heart" viewBox="0 0 24 22" aria-hidden="true">
    <path d="M12 21 C4 14 0 10 3 5 C5.5 1.5 10 2.5 12 6 C14 2.5 18.5 1.5 21 5 C24 10 20 14 12 21 Z" fill="#C2536E"/>
  </svg>
</main>
<script src="renderer.js"></script>
</body>
</html>
